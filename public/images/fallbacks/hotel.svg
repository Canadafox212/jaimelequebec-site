<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- Ciel -->
  <rect width="800" height="450" fill="#001a4d"/>

  <!-- Bâtiment principal -->
  <rect x="160" y="120" width="480" height="290" fill="#002266"/>
  <!-- Toit plat avec acrotère -->
  <rect x="150" y="108" width="500" height="18" fill="#003399" rx="2"/>

  <!-- Façade : rangées de fenêtres (6 colonnes × 5 rangées) -->
  <!-- Rangée 1 -->
  <rect x="210" y="140" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>
  <rect x="280" y="140" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>
  <rect x="350" y="140" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>
  <rect x="420" y="140" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.6"/>
  <rect x="490" y="140" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>
  <rect x="560" y="140" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.7"/>
  <!-- Rangée 2 -->
  <rect x="210" y="188" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.7"/>
  <rect x="280" y="188" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>
  <rect x="350" y="188" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.6"/>
  <rect x="420" y="188" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>
  <rect x="490" y="188" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.5"/>
  <rect x="560" y="188" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>
  <!-- Rangée 3 -->
  <rect x="210" y="236" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>
  <rect x="280" y="236" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.6"/>
  <rect x="350" y="236" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>
  <rect x="420" y="236" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.8"/>
  <rect x="490" y="236" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>
  <rect x="560" y="236" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.4"/>
  <!-- Rangée 4 -->
  <rect x="210" y="284" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.6"/>
  <rect x="280" y="284" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>
  <rect x="350" y="284" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>
  <rect x="420" y="284" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.5"/>
  <rect x="490" y="284" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>
  <rect x="560" y="284" width="50" height="32" fill="#FDF6EC" rx="2" opacity="0.9"/>

  <!-- Entrée de l'hôtel (rez-de-chaussée) -->
  <rect x="340" y="340" width="120" height="70" fill="#001a4d"/>
  <!-- Auvent entrée -->
  <polygon points="310,340 490,340 470,320 330,320" fill="#003399"/>
  <!-- Portes vitrées -->
  <rect x="355" y="350" width="38" height="60" fill="#4A90D9" rx="1" opacity="0.6"/>
  <rect x="407" y="350" width="38" height="60" fill="#4A90D9" rx="1" opacity="0.6"/>
  <!-- Séparation porte -->
  <line x1="393" y1="350" x2="393" y2="410" stroke="#002266" stroke-width="4"/>
  <line x1="445" y1="350" x2="445" y2="410" stroke="#002266" stroke-width="4"/>

  <!-- Panneaux latéraux du rez-de-chaussée -->
  <rect x="170" y="340" width="155" height="70" fill="#001f55"/>
  <rect x="475" y="340" width="155" height="70" fill="#001f55"/>

  <!-- Sol -->
  <rect x="140" y="408" width="520" height="12" fill="#003399" rx="2"/>
  <rect x="0" y="420" width="800" height="30" fill="#001133"/>

  <!-- Lumières de nuit : quelques fenêtres éclairées plus chaudement -->
  <rect x="210" y="140" width="50" height="32" fill="#FFE0A0" rx="2" opacity="0.3"/>
  <rect x="420" y="188" width="50" height="32" fill="#FFE0A0" rx="2" opacity="0.4"/>
  <rect x="280" y="236" width="50" height="32" fill="#FFE0A0" rx="2" opacity="0.3"/>

  <!-- Étoiles discrètes -->
  <circle cx="80" cy="60" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="140" cy="30" r="1" fill="white" opacity="0.5"/>
  <circle cx="700" cy="50" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="730" cy="80" r="1" fill="white" opacity="0.5"/>
  <circle cx="650" cy="25" r="2" fill="white" opacity="0.6"/>
  <circle cx="100" cy="90" r="1" fill="white" opacity="0.4"/>
</svg>
